<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Neo4j graph logo - nodes and edges in brand blue -->
  <g transform="translate(128,128)">
    <!-- Edges -->
    <line x1="0" y1="0" x2="65" y2="-55" stroke="#018BFF" stroke-width="6" opacity="0.5"/>
    <line x1="0" y1="0" x2="70" y2="40" stroke="#018BFF" stroke-width="6" opacity="0.5"/>
    <line x1="0" y1="0" x2="-65" y2="15" stroke="#018BFF" stroke-width="6" opacity="0.5"/>
    <line x1="0" y1="0" x2="-40" y2="-60" stroke="#018BFF" stroke-width="6" opacity="0.5"/>
    <line x1="0" y1="0" x2="-10" y2="70" stroke="#018BFF" stroke-width="6" opacity="0.5"/>
    <line x1="65" y1="-55" x2="70" y2="40" stroke="#018BFF" stroke-width="4" opacity="0.3"/>
    <line x1="-65" y1="15" x2="-40" y2="-60" stroke="#018BFF" stroke-width="4" opacity="0.3"/>
    <line x1="-65" y1="15" x2="-10" y2="70" stroke="#018BFF" stroke-width="4" opacity="0.3"/>
    <!-- Nodes -->
    <circle cx="0" cy="0" r="22" fill="#018BFF"/>
    <circle cx="65" cy="-55" r="16" fill="#018BFF"/>
    <circle cx="70" cy="40" r="16" fill="#018BFF"/>
    <circle cx="-65" cy="15" r="16" fill="#018BFF"/>
    <circle cx="-40" cy="-60" r="14" fill="#018BFF" opacity="0.7"/>
    <circle cx="-10" cy="70" r="14" fill="#018BFF" opacity="0.7"/>
  </g>
</svg>