<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- SQL database cylinder icon -->
  <g transform="translate(128,128)">
    <!-- Cylinder body -->
    <rect x="-60" y="-50" width="120" height="100" rx="2" fill="#1B3A5C"/>
    <!-- Top ellipse -->
    <ellipse cx="0" cy="-50" rx="60" ry="22" fill="#2A5A8C"/>
    <ellipse cx="0" cy="-50" rx="60" ry="22" fill="none" stroke="#1B3A5C" stroke-width="2"/>
    <!-- Bottom ellipse -->
    <path d="M-60 50 Q-60 72 0 72 Q60 72 60 50" fill="#142D47"/>
    <!-- Middle rings -->
    <path d="M-60 -10 Q-60 12 0 12 Q60 12 60 -10" fill="none" stroke="#2A5A8C" stroke-width="2.5" opacity="0.6"/>
    <path d="M-60 30 Q-60 52 0 52 Q60 52 60 30" fill="none" stroke="#2A5A8C" stroke-width="2.5" opacity="0.4"/>
    <!-- Highlight -->
    <ellipse cx="0" cy="-50" rx="60" ry="22" fill="none" stroke="#4A8BC2" stroke-width="2"/>
  </g>
</svg>