<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- DuckDB duck logo -->
  <g transform="translate(128,130)">
    <!-- Duck body -->
    <ellipse cx="10" cy="20" rx="60" ry="42" fill="#FEC107"/>
    <!-- Duck head -->
    <circle cx="-35" cy="-22" r="35" fill="#FEC107"/>
    <!-- Eye white -->
    <circle cx="-44" cy="-30" r="8" fill="#fff"/>
    <!-- Eye pupil -->
    <circle cx="-46" cy="-31" r="4.5" fill="#1B3A5C"/>
    <circle cx="-44.5" cy="-32.5" r="1.5" fill="#fff"/>
    <!-- Beak -->
    <path d="M-70 -18 l-22 5 l22 8z" fill="#E8792F"/>
    <!-- Wing -->
    <ellipse cx="20" cy="10" rx="32" ry="22" fill="#E5AB00" transform="rotate(-8)"/>
  </g>
</svg>