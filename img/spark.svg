<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Apache Spark logo - orange hexagonal spark -->
  <g transform="translate(128,128)">
    <!-- Outer hexagon -->
    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="#E8792F"/>
    <!-- Inner hexagon -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#fff"/>
    <!-- Center spark diamond -->
    <polygon points="0,-35 20,0 0,35 -20,0" fill="#E8792F"/>
  </g>
</svg>