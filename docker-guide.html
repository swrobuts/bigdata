        :root { --primary: #1B3A5C; --accent: #E8792F; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif; background: #fafbfc; color: #374151; line-height: 1.7; }

        /* Utility classes */
        .text-dark-blue { color: var(--primary); }
        .bg-dark-blue { background-color: var(--primary); }
        .text-orange { color: var(--accent); }
        .border-orange { border-color: var(--accent); }

        /* RTL */
        html[dir="rtl"] .sidebar { left: auto; right: 0; border-right: none; border-left: 1px solid #ddd; }
        html[dir="rtl"] .sidebar-item { border-left: none; border-right: 3px solid transparent; }
        html[dir="rtl"] .sidebar-item.active { border-right-color: var(--accent); }
        html[dir="rtl"] .main-content { margin-left: 0; margin-right: 260px; }
        html[dir="rtl"] .code-block { border-left: none; border-right: 4px solid var(--accent); }
        html[dir="rtl"] .info-box { border-left: none; border-right: 4px solid #3b82f6; }
        html[dir="rtl"] .warning-box { border-left: none; border-right: 4px solid #fbbf24; }
        html[dir="rtl"] .problem-item { border-left: none; border-right: 4px solid var(--accent); }

        /* Header – fixed dark blue bar */
        .header { position: fixed; top: 0; left: 0; right: 0; background: var(--primary); height: 4rem; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; z-index: 50; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
        .header-left { display: flex; align-items: center; gap: 1rem; }
        .back-link { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.85rem; font-weight: 600; transition: color 0.2s; white-space: nowrap; }
        .back-link:hover { color: white; }
        .header-title { color: white; font-size: 1.35rem; font-weight: 700; margin: 0; }
        .lang-switcher { display: flex; gap: 0.4rem; align-items: center; }
        .lang-btn { padding: 0.35rem 0.65rem; border-radius: 0.375rem; border: 2px solid rgba(255,255,255,0.25); background: transparent; cursor: pointer; font-weight: 700; font-size: 0.75rem; color: rgba(255,255,255,0.6); transition: all 0.2s; }
        .lang-btn:hover:not(.active) { border-color: rgba(255,255,255,0.5); color: white; }
        .lang-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* Sidebar */
        .sidebar { position: fixed; left: 0; top: 4rem; width: 260px; height: calc(100vh - 4rem); background: #f0f4f8; border-right: 1px solid #ddd; overflow-y: auto; padding: 1.5rem 0; z-index: 40; }

        .sidebar-item:hover { background: #e1eaf5; color: var(--primary); }
        .sidebar-item.active { background: rgba(232,121,47,0.08); color: var(--accent); border-left-color: var(--accent); font-weight: 700; }

        /* Main Content */
        .main-content { margin-left: 260px; padding: 5.5rem 3rem 3rem 3rem; max-width: 1000px; }

        /* Typography – section headings in accent orange */
        .section-header { color: var(--accent); font-size: 2.2rem; font-weight: 800; margin: 0 0 1rem 0; line-height: 1.2; letter-spacing: -0.02em; padding-bottom: 0.5rem; border-bottom: 3px solid var(--accent); }
        p { color: #374151; font-size: 1rem; line-height: 1.75; margin-bottom: 0.85rem; }

        /* Section visual separation */
        section[id] { scroll-margin-top: 5rem; margin-bottom: 2.5rem; padding-bottom: 1rem; }
        section[id] + section[id] { border-top: 1px solid #e2e8f0; padding-top: 2rem; }

        /* Hero */
        .hero-section { background: var(--primary); color: white; border-radius: 0.75rem; padding: 2rem; margin-bottom: 2rem; }

        /* Code Blocks */
        .code-block { background: #1e293b; border-left: 4px solid var(--accent); color: #e2e8f0; font-family: 'Courier New', monospace; padding: 1.25rem; border-radius: 0.5rem; font-size: 0.85rem; margin: 1.25rem 0; white-space: pre-wrap; overflow-x: auto; line-height: 1.55; position: relative; }
        .code-text { color: #e2e8f0; font-family: 'Courier New', monospace; font-size: 0.875rem; margin: 0; word-break: break-all; white-space: pre-wrap; }
        .copy-button { position: absolute; top: 0.6rem; right: 0.5rem; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); color: #94a3b8; border-radius: 0.375rem; padding: 0.2rem 0.6rem; font-size: 0.72rem; cursor: pointer; transition: all 0.2s; font-family: -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.5; }
        .copy-button:hover { background: rgba(255,255,255,0.18); color: #e2e8f0; }

        /* Step Numbers */
        .step-number { background: var(--accent); color: white; width: 1.75rem; height: 1.75rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; font-size: 0.8rem; }

        /* Info & Warning Boxes */
        .info-box { background: #eff6ff; border-left: 4px solid #3b82f6; padding: 1rem 1.25rem; border-radius: 0.5rem; margin: 1.25rem 0; font-size: 0.95rem; color: #1e40af; }
        .warning-box { background: #fffbeb; border-left: 4px solid #fbbf24; padding: 1rem 1.25rem; border-radius: 0.5rem; margin: 1.25rem 0; font-size: 0.95rem; color: #92400e; }

        /* Tables */
        .table-responsive { overflow-x: auto; margin: 1.5rem 0; }
        table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.9rem; border-radius: 0.5rem; overflow: hidden; }
        th { background: var(--primary); color: white; padding: 0.65rem 1rem; text-align: left; font-weight: 600; font-size: 0.85rem; }
        td { padding: 0.65rem 1rem; border-bottom: 1px solid #e5e7eb; color: #4b5563; font-size: 0.9rem; }
        tr:hover td { background: #f8fafc; }

        /* Links */
        .link-button { color: var(--accent); text-decoration: none; font-weight: 500; transition: all 0.2s; }
        .link-button:hover { text-decoration: underline; }

        /* Problem Items */
        .problem-item { margin-bottom: 1.5rem; padding: 1rem; border-left: 4px solid var(--accent); background-color: #fafafa; border-radius: 0.5rem; }

        /* Progress Bar */
        .progress-bar-container { position: fixed; top: 4rem; left: 260px; right: 0; height: 3px; background: #e2e8f0; z-index: 45; }
        .progress-bar-fill { height: 100%; background: var(--accent); transition: width 0.3s ease; }

        /* Footer */
        .lab-footer { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #e5e7eb; text-align: center; color: #9ca3af; font-size: 0.85rem; }
        .lab-footer p { color: #9ca3af; margin: 0.25rem 0; }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 5rem 1.5rem 2rem 1.5rem; }
            html[dir="rtl"] .main-content { margin-right: 0; }
            .progress-bar-container { left: 0; }
        }
    </style>
</head>

                            setActiveSection(entry.target.id);
                            const sidebarItem = document.querySelector('.sidebar-item.active');
                            if (sidebarItem) sidebarItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                        }
                    });
                }, { rootMargin: '-80px 0px -60% 0px', threshold: [0.15, 0.5] });
                sections.forEach(s => observer.observe(s));
                return () => observer.disconnect();
            }, []);

            // Progress bar tracking
            React.useEffect(() => {
                const handleScroll = () => {
                    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
                    const scrolled = window.scrollY;
                    setProgress(docHeight > 0 ? (scrolled / docHeight) * 100 : 0);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

                navigator.clipboard.writeText(code);
                setCopiedCode(id);
                setTimeout(() => setCopiedCode(null), 2000);
            };

                                                <td colSpan="3">{t.reqRAMMin}</td>
                                            </tr>
                                            <tr>
                                                <td className="font-semibold">{t.reqDisk}</td>
                                                <td colSpan="3">{t.reqDiskMin}</td>
                                            </tr>
                                            <tr>
                                                <td className="font-semibold">{t.reqExtra}</td>
                                                <td>{t.reqWSL}</td>
                                                <td>-</td>
                                                <td>-</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div className="warning-box" style={{marginTop: '1.5rem'}}>
                                    <p className="text-gray-700">{t.reqWSLNote}</p>
                                </div>
                            </section>

                            {/* Section 5: Installation */}
                            <section id="installation" className="mb-12">
                                <h2 className="section-header">{t.section5Title}</h2>
                                <p className="text-gray-700 mb-6">{t.section5Intro}</p>

                                <StepItem
                                    number="1"
                                    title={t.step1Title}
                                    description={t.step1Desc}
                                />
                                <StepItem
                                    number="2"
                                    title={t.step2Title}
                                    description={t.step2Desc}
                                />
                                <StepItem
                                    number="3"
                                    title={t.step3Title}
                                    description={t.step3Desc}
                                />
                                <StepItem
                                    number="4"
                                    title={t.step4Title}
                                    description={t.step4Desc}
                                />
                                <StepItem
                                    number="5"
                                    title={t.step5Title}
                                    description={t.step5Desc}
                                    code="docker --version"
                                    codeId="cmd-version"
                                />
                                <StepItem
                                    number="6"
                                    title={t.step6Title}
                                    description={t.step6Desc}
                                    code="docker run hello-world"
                                    codeId="cmd-helloworld"
                                />
                                <div className="info-box">
                                    <p>{t.step6Success}</p>
                                </div>
                            </section>

                            {/* Section 6: First Lab */}
                            <section id="first-lab" className="mb-12">
                                <h2 className="section-header">{t.section6Title}</h2>
                                <p className="text-gray-700 mb-6">{t.section6Intro}</p>
                                <div className="warning-box" style={{marginBottom: '1.5rem'}}>
                                    <p className="font-semibold text-dark-blue">{t.windowsLabNote}</p>
                                </div>

                                <StepItem
                                    number="1"
                                    title={t.labStep1Title}
                                    description={t.labStep1Desc}
                                    code="git clone https://github.com/swrobuts/bigdata"
                                    codeId="cmd-clone"
                                />
                                <StepItem
                                    number="2"
                                    title={t.labStep2Title}
                                    description={t.labStep2Desc}
                                    code="cd bigdata"
                                    codeId="cmd-cd"
                                />
                                <StepItem
                                    number="3"
                                    title={t.labStep3Title}
                                    description={t.labStep3Desc}
                                    code="python3 -m venv venv && source venv/bin/activate && pip install numpy pandas pyarrow && python data/generate_megastore_data.py"
                                    codeId="cmd-data"
                                />
                                <StepItem
                                    number="4"
                                    title={t.labStep4Title}
                                    description={t.labStep4Desc}
                                    code="cd docker && chmod +x start-lab.sh && ./start-lab.sh mongodb"
                                    codeId="cmd-start-lab"
                                />
                                <div className="flex gap-4 mb-6">
                                    <div className="step-number">5</div>
                                    <div className="flex-1">
                                        <h4 className="text-lg font-semibold text-dark-blue mb-2">{t.labStep5Title}</h4>
                                        <p className="text-gray-700 mb-3">{t.labStep5Desc}</p>
                                        <a href="http://localhost:8081" target="_blank" rel="noopener noreferrer"
                                           style={{color: '#E8792F', fontWeight: 'bold', fontSize: '1.1rem', textDecoration: 'underline'}}>
                                            http://localhost:8081
                                        </a>
                                    </div>
                                </div>
                                <div className="info-box">
                                    <p>{t.labStep5Note}</p>
                                </div>
                                <StepItem
                                    number="6"
                                    title={t.labStep6Title}
                                    description={t.labStep6Desc}
                                    code="./start-lab.sh stop"
                                    codeId="cmd-stop"
                                />
                            </section>

                            {/* Section 7: Troubleshooting */}
                            <section id="troubleshooting" className="mb-12">
                                <h2 className="section-header">{t.section7Title}</h2>
                                <p className="text-gray-700 mb-6">{t.section7Intro}</p>

                                {[
                                    { problem: t.problemNotStarting, solution: t.solutionNotStarting },
                                    { problem: t.problemPort, solution: t.solutionPort },
                                    {
                                        problem: t.problemDisk,
                                        solution: t.solutionDisk,
                                        code: 'docker rm -f megastore-mongodb megastore-mongo-express megastore-duckdb megastore-neo4j megastore-spark 2>/dev/null; echo Done!'
                                    },
                                    {
                                        problem: t.problemExit,
                                        solution: t.solutionExit,
                                        code: 'docker logs megastore-mongodb'
                                    },
                                    { problem: t.problemConnect, solution: t.solutionConnect }
                                ].map((item, idx) => (
                                    <div key={idx} className="problem-item">
                                        <h4 className="font-bold text-dark-blue mb-2">❓ {item.problem}</h4>
                                        <p className="text-gray-700">{item.solution}</p>
                                        {item.code && (
                                            <div className="mt-3">
                                                <CodeBlock code={item.code} id={`troubleshoot-${idx}`} />
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </section>

                            {/* Section 8: Cleanup */}
                            <section id="cleanup" className="mb-12">
                                <h2 className="section-header">{t.section9Title}</h2>
                                <p className="text-gray-700 mb-6">{t.section9Intro}</p>

                                <div className="space-y-6">
                                    <div>
                                        <h4 className="font-bold text-dark-blue mb-2">{t.cleanupCheck}</h4>
                                        <p className="text-gray-700 mb-3">{t.cleanupCheckDesc}</p>
                                        <CodeBlock code="docker system df" id="cmd-df" />
                                    </div>

                                    <div>
                                        <h4 className="font-bold text-dark-blue mb-2">{t.cleanupStop}</h4>
                                        <p className="text-gray-700 mb-3">{t.cleanupStopDesc}</p>
                                        <CodeBlock code="docker rm -f megastore-mongodb megastore-mongo-express megastore-duckdb megastore-neo4j megastore-spark 2>/dev/null; echo 'Done!'" id="cmd-stopall" />
                                    </div>

                                    <div>
                                        <h4 className="font-bold text-dark-blue mb-2">{t.cleanupImages}</h4>
                                        <p className="text-gray-700 mb-3">{t.cleanupImagesDesc}</p>
                                        <CodeBlock code="docker rmi mongo:7.0 mongo-express:latest neo4j:5.18-community 2>/dev/null; echo 'Done!'" id="cmd-rmimages" />
                                    </div>

                                    <div>
                                        <h4 className="font-bold text-dark-blue mb-2">{t.cleanupVolumes}</h4>
                                        <p className="text-gray-700 mb-3">{t.cleanupVolumesDesc}</p>
                                        <CodeBlock code="docker volume rm mongodb_data neo4j_data neo4j_conf 2>/dev/null; docker network rm megastore 2>/dev/null; echo 'Done!'" id="cmd-rmvolumes" />
                                    </div>
                                </div>

                                <p className="text-gray-700 mt-6 mb-4">{t.cleanupDesktopDesc}</p>

                                <div className="info-box">
                                    <p className="text-gray-700">{t.cleanupWarning}</p>
                                </div>
                            </section>

                            {/* Section 9: Next Steps */}
                            <section id="next-steps" className="mb-12">
                                <h2 className="section-header">{t.section8Title}</h2>
                                <p className="text-gray-700 mb-4">{t.section8Intro}</p>
                                <h4 className="text-lg font-bold text-dark-blue mt-6 mb-4">{t.section8Labs}</h4>
                                <ul className="space-y-2 mb-6">
                                    <li>
                                        <a href="lab-mongodb.html" className="link-button">
                                            {t.mongodbLab}
                                        </a>
                                    </li>
                                    <li>
                                        <a href="lab-duckdb.html" className="link-button">
                                            {t.duckdbLab}
                                        </a>
                                    </li>
                                    <li>
                                        <a href="lab-neo4j.html" className="link-button">
                                            {t.neo4jLab}
                                        </a>
                                    </li>
                                    <li>
                                        <a href="lab-spark.html" className="link-button">
                                            {t.sparkLab}
                                        </a>
                                    </li>
                                </ul>
                                <div className="info-box">
                                    <p className="text-lg font-semibold">{t.section8Conclusion}</p>
                                </div>
                            </section>

                            {/* Footer */}
                            <footer className="lab-footer">
                                <p>Prof. Dr. Robert Butscher {'\u00b7'} THWS - Technische Hochschule W{'\u00fc'}rzburg-Schweinfurt</p>
                                <p>{'\u00a9'} 2026 Big Data Lab</p>
                            </footer>
                        </main>
                </div>
            );
        }

        ReactDOM.render(<DockerGuide />, document.getElementById('root'));
    </script>
</body>
</html>
