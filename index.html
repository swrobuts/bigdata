                    faq2_right_title: 'Neo4j',

                    faq4_left_title: 'Neo4j (Cypher)',

                    faq4_right_title: 'SQL (DuckDB/Spark)',
                    faq4_right_desc: 'WITH RECURSIVE \u064A\u0645\u0643\u0646\u0647 \u0646\u0645\u0630\u062C\u0629 \u0627\u0644\u0645\u0633\u0627\u0631\u0627\u062A \u0648\u0627\u0644\u062A\u0633\u0644\u0633\u0644\u0627\u062A \u0627\u0644\u0647\u0631\u0645\u064A\u0629. \u0647\u0630\u0627 \u0645\u0645\u0643\u0646 \u0644\u0643\u0646\u0647 \u063A\u0627\u0644\u0628\u0627\u064B \u064A\u0635\u0628\u062D \u0623\u0643\u062B\u0631 \u062A\u0639\u0642\u064A\u062F\u0627\u064B \u0645\u0646 Cypher \u0644\u0644\u062A\u062A\u0628\u0639\u0627\u062A \u0627\u0644\u0639\u0645\u064A\u0642\u0629. SQL \u064A\u0638\u0644 \u0642\u0648\u064A\u0627\u064B \u0628\u0634\u0643\u0644 \u062E\u0627\u0635 \u0641\u064A \u0627\u0644\u062A\u062C\u0645\u064A\u0639\u0627\u062A\u060C GROUP BY\u060C \u062F\u0648\u0627\u0644 WINDOW \u0648\u0627\u0644\u062A\u062D\u0644\u064A\u0644 \u0627\u0644\u062C\u062F\u0648\u0644\u064A.',

        /* ── CountUp Component ── */
        const CountUp = ({ end, suffix = '', duration = 2000 }) => {
            const [count, setCount] = useState(0);
            const [hasStarted, setHasStarted] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => { if (entry.isIntersecting && !hasStarted) setHasStarted(true); },
                    { threshold: 0.5 }
                );
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, [hasStarted]);

            useEffect(() => {
                if (!hasStarted) return;
                const startTime = Date.now();
                const numEnd = parseFloat(end);
                const tick = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    setCount(Math.round(eased * numEnd));
                    if (progress < 1) requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
            }, [hasStarted, end, duration]);

            return <span ref={ref}>{count}{suffix}</span>;
        };

                                            <div key={si} style={{ background: `${side.color}0A`, border: `1.5px solid ${side.color}30`, borderRadius: 12, padding: '1.5rem' }}>
                                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem', marginBottom: '1rem' }}>
                                                    <span style={{ background: side.color, color: side.color === '#FEC107' ? '#1B3A5C' : 'white', fontWeight: 800, fontSize: '0.8rem', padding: '0.35rem 0.75rem', borderRadius: 8 }}>
                                                        {side.title}
                                                    </span>
                                                    {side.logo ? <img src={side.logo} alt={side.title} style={{ height: 28 }} onError={(e) => e.target.style.display='none'} /> : (
                                                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={side.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                                                    )}
                                                </div>
                                                <p style={{ color: '#4b5563', fontSize: '0.88rem', lineHeight: 1.7, margin: 0 }}>{side.desc}</p>
                                            </div>
                                        ))}
                                    </div>

                                    <div style={{ background: '#f8f9fa', borderRadius: 10, padding: '1.25rem 1.5rem', borderLeft: '4px solid #cbd5e1' }}>
                                        <div style={{ fontWeight: 900, color: '#1B3A5C', marginBottom: '0.5rem', fontSize: '0.95rem' }}>{faq.rule}</div>
                                        <p style={{ color: '#4b5563', fontSize: '0.9rem', lineHeight: 1.7, margin: 0, fontWeight: 600, whiteSpace: 'pre-line' }}>{faq.ruleText}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* ── Bonus: Project Phil ── */}
                    <section style={{ padding: '0 1.5rem 4rem', background: 'white', paddingTop: '4rem' }}>
                        <div style={{ maxWidth: 1200, margin: '0 auto' }}>
                            <div
                               style={{
                                   background: 'linear-gradient(135deg, rgba(27,58,92,0.08) 0%, rgba(27,58,92,0.16) 100%)',
                                   borderRadius: 14, padding: '2rem 2.25rem',
                                   boxShadow: '0 8px 32px rgba(27,58,92,0.06)',
                                   border: '1.5px solid rgba(27,58,92,0.15)'
                               }}
                               ref={ref}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', marginBottom: '0.75rem', flexWrap: 'wrap' }}>
                                    <span style={{ background: '#E8792F', color: 'white', fontWeight: 800, fontSize: '0.72rem', padding: '0.2rem 0.65rem', borderRadius: 999 }}>
                                        ⭐ Bonus
                                    </span>
                                    <span style={{ background: 'rgba(27,58,92,0.1)', color: '#1B3A5C', fontWeight: 700, fontSize: '0.72rem', padding: '0.2rem 0.65rem', borderRadius: 999 }}>
                                        {t.bonus.subtitle}
                                    </span>
                                </div>
                                <div style={{ fontSize: '1.3rem', fontWeight: 900, color: '#0F2744', marginBottom: '0.5rem', letterSpacing: '-0.01em' }}>
                                    {t.bonus.title}
                                </div>
                                <p style={{ color: '#4b5563', fontSize: '0.88rem', lineHeight: 1.65, margin: '0 0 1.5rem 0' }}>
                                    {t.bonus.intro}
                                </p>
                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '0.75rem', marginBottom: '1.5rem' }}>
                                    {t.bonus.techs.map((tech, i) => (
                                        <div key={i} style={{ background: 'rgba(255,255,255,0.7)', border: '1px solid rgba(27,58,92,0.1)', borderRadius: 8, padding: '1rem', display: 'flex', flexDirection: 'column' }}>
                                            <span style={{ background: 'rgba(27,58,92,0.1)', color: '#1B3A5C', fontSize: '0.65rem', fontWeight: 700, padding: '0.15rem 0.5rem', borderRadius: 999, alignSelf: 'flex-start', marginBottom: '0.5rem' }}>{tech.badge}</span>
                                            <span style={{ fontWeight: 700, color: '#0F2744', fontSize: '0.85rem', marginBottom: '0.4rem' }}>{tech.name}</span>
                                            <p style={{ color: '#64748b', fontSize: '0.8rem', lineHeight: 1.55, margin: 0 }}>{tech.desc}</p>
                                        </div>
                                    ))}
                                </div>
                                <a href="https://swrobuts.github.io/phil-website/" target="_blank" rel="noopener noreferrer"
                                   style={{ display: 'inline-flex', alignItems: 'center', gap: '0.4rem', color: '#E8792F', fontWeight: 700, fontSize: '0.88rem', textDecoration: 'none' }}>
                                    {t.bonus.cta}
                                </a>
                            </div>
                        </div>
                    </section>

                    {/* ── Footer ── */}
                    <footer style={{ padding: '2.5rem 1.5rem', background: '#0f172a', textAlign: 'center' }}>
                        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '1rem' }}>
                            <Icon paths={ICON_CODE} size={20} style={{ color: '#475569', stroke: '#475569' }}/>
                        </div>
                        <p style={{ fontWeight: 700, color: '#e2e8f0', marginBottom: '0.3rem', fontSize: '0.9rem' }}>{t.footer.built}</p>
                        <p style={{ color: '#64748b', fontSize: '0.82rem', marginBottom: '0.25rem' }}>{t.footer.professor}</p>
                        <p style={{ color: '#475569', fontSize: '0.72rem', marginBottom: '0.5rem' }}>{t.footer.thws}</p>
                        <div style={{ marginTop: '1.25rem' }}>
                            <a href="https://github.com/swrobuts/bigdata" style={{ display: 'inline-flex', alignItems: 'center', gap: '0.4rem', color: '#60a5fa', fontSize: '0.82rem', textDecoration: 'none' }}>
                                <Icon paths={ICON_GITHUB} size={14}/> {t.footer.github}
                            </a>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
