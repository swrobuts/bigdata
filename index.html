        /* ── CountUp Component ── */
        const CountUp = ({ end, suffix = '', duration = 2000 }) => {
            const [count, setCount] = useState(0);
            const [hasStarted, setHasStarted] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => { if (entry.isIntersecting && !hasStarted) setHasStarted(true); },
                    { threshold: 0.5 }
                );
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, [hasStarted]);

            useEffect(() => {
                if (!hasStarted) return;
                const startTime = Date.now();
                const numEnd = parseFloat(end);
                const tick = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    setCount(Math.round(eased * numEnd));
                    if (progress < 1) requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
            }, [hasStarted, end, duration]);

            return <span ref={ref}>{count}{suffix}</span>;
        };

                                <h2 style={{ fontSize: 'clamp(1.8rem, 3.5vw, 2.5rem)', fontWeight: 900, color: '#0F2744', marginBottom: '0.6rem', letterSpacing: '-0.02em' }}>{t.labs.title}</h2>
                            </div>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '1.25rem' }}>
                                {labsData.map((lab, i) => {
                                    const info = t.labs[lab.key];
                                    return (
                                        <a key={i} href={`lab-${lab.key}.html`} className="lab-card" ref={ref}>
                                            <span className="lab-card-num">{String(i+1).padStart(2,'0')}</span>
                                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', marginBottom: '1rem' }}>
                                                <div className="lab-icon-box" style={{ marginBottom: 0 }}>
                                                    <Icon paths={lab.icon} size={20}/>
                                                </div>
                                                <span className={`diff-badge ${DiffMap[lab.diff]}`}>{info.difficulty}</span>
                                            </div>
                                            <div className="lab-title">{info.name}</div>
                                            <div className="lab-subtitle">{info.subtitle}</div>
                                            <p className="lab-desc">{info.desc}</p>
                                            <div className="lab-footer">
                                                <span className="lab-cta">{info.cta} →</span>
                                            </div>
                                        </a>
                                    );
                                })}
                            </div>
                        </div>
                    </section>

                    {/* ── Bonus: Project Phil ── */}
                    <section style={{ padding: '0 1.5rem 4rem', background: 'white', paddingTop: '4rem' }}>
                        <div style={{ maxWidth: 1200, margin: '0 auto' }}>
                            <div
                               style={{
                                   background: 'linear-gradient(135deg, rgba(27,58,92,0.08) 0%, rgba(27,58,92,0.16) 100%)',
                                   borderRadius: 14, padding: '2rem 2.25rem',
                                   boxShadow: '0 8px 32px rgba(27,58,92,0.06)',
                                   border: '1.5px solid rgba(27,58,92,0.15)'
                               }}
                               ref={ref}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', marginBottom: '0.75rem', flexWrap: 'wrap' }}>
                                    <span style={{ background: '#E8792F', color: 'white', fontWeight: 800, fontSize: '0.72rem', padding: '0.2rem 0.65rem', borderRadius: 999 }}>
                                        ⭐ Bonus
                                    </span>
                                    <span style={{ background: 'rgba(27,58,92,0.1)', color: '#1B3A5C', fontWeight: 700, fontSize: '0.72rem', padding: '0.2rem 0.65rem', borderRadius: 999 }}>
                                        {t.bonus.subtitle}
                                    </span>
                                </div>
                                <div style={{ fontSize: '1.3rem', fontWeight: 900, color: '#0F2744', marginBottom: '0.5rem', letterSpacing: '-0.01em' }}>
                                    {t.bonus.title}
                                </div>
                                <p style={{ color: '#4b5563', fontSize: '0.88rem', lineHeight: 1.65, margin: '0 0 1.5rem 0' }}>
                                    {t.bonus.intro}
                                </p>
                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '0.75rem', marginBottom: '1.5rem' }}>
                                    {t.bonus.techs.map((tech, i) => (
                                        <div key={i} style={{ background: 'rgba(255,255,255,0.7)', border: '1px solid rgba(27,58,92,0.1)', borderRadius: 8, padding: '1rem' }}>
                                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.4rem', flexWrap: 'wrap' }}>
                                                <span style={{ fontWeight: 700, color: '#0F2744', fontSize: '0.85rem' }}>{tech.name}</span>
                                                <span style={{ background: 'rgba(27,58,92,0.1)', color: '#1B3A5C', fontSize: '0.65rem', fontWeight: 700, padding: '0.15rem 0.5rem', borderRadius: 999 }}>{tech.badge}</span>
                                            </div>
                                            <p style={{ color: '#64748b', fontSize: '0.8rem', lineHeight: 1.55, margin: 0 }}>{tech.desc}</p>
                                        </div>
                                    ))}
                                </div>
                                <a href="https://swrobuts.github.io/phil-website/" target="_blank" rel="noopener noreferrer"
                                   style={{ display: 'inline-flex', alignItems: 'center', gap: '0.4rem', color: '#E8792F', fontWeight: 700, fontSize: '0.88rem', textDecoration: 'none' }}>
                                    {t.bonus.cta}
                                </a>
                            </div>
                        </div>
                    </section>

                    {/* ── Footer ── */}
                    <footer style={{ padding: '2.5rem 1.5rem', background: '#0f172a', textAlign: 'center' }}>
                        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '1rem' }}>
                            <Icon paths={ICON_CODE} size={20} style={{ color: '#475569', stroke: '#475569' }}/>
                        </div>
                        <p style={{ fontWeight: 700, color: '#e2e8f0', marginBottom: '0.3rem', fontSize: '0.9rem' }}>{t.footer.built}</p>
                        <p style={{ color: '#64748b', fontSize: '0.82rem', marginBottom: '0.25rem' }}>{t.footer.professor}</p>
                        <p style={{ color: '#475569', fontSize: '0.72rem', marginBottom: '0.5rem' }}>{t.footer.thws}</p>
                        <div style={{ marginTop: '1.25rem' }}>
                            <a href="https://github.com/swrobuts/bigdata" style={{ display: 'inline-flex', alignItems: 'center', gap: '0.4rem', color: '#60a5fa', fontSize: '0.82rem', textDecoration: 'none' }}>
                                <Icon paths={ICON_GITHUB} size={14}/> {t.footer.github}
                            </a>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
